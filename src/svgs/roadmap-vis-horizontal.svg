<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="209" viewBox="0 0 1200 209">
  <defs>
    <style>
      .roadmap-horizontal-cls-1 {
        fill: none;
        stroke: #f5d095;
        stroke-linecap: round;
        stroke-width: 3px;
        stroke-dasharray: 10;
      }

      .roadmap-horizontal-cls-2 {
        fill: #27363b;
      }

      .roadmap-horizontal-cls-3, .roadmap-horizontal-cls-5, .roadmap-horizontal-cls-6 {
        fill: #fff;
      }

      .roadmap-horizontal-cls-3, .roadmap-horizontal-cls-5 {
        font-size: 18px;
      }

      .roadmap-horizontal-cls-3 {
        font-family: Satoshi-Bold, Satoshi;
        font-weight: 700;
      }

      .roadmap-horizontal-cls-4 {
        fill: #707070;
        font-size: 16px;
        font-family: HelveticaNeue, Helvetica Neue;
      }

      .roadmap-horizontal-cls-5, .roadmap-horizontal-cls-6 {
        font-family: Satoshi-Medium, Satoshi;
        font-weight: 500;
      }

      .roadmap-horizontal-cls-6 {
        font-size: 14px;
      }

      .roadmap-horizontal-cls-7 {
        filter: url(#circle-seed);
      }

      .roadmap-horizontal-cls-8 {
        filter: url(#circle-sprout);
      }

      .roadmap-horizontal-cls-9 {
        filter: url(#circle-sapling);
      }

      .roadmap-horizontal-cls-10 {
        filter: url(#circle-tree);
      }

      .roadmap-horizontal-cls-11 {
        filter: url(#circle-forest);
      }
    </style>

    <!-- Circle filters for each stage -->
    <filter id="circle-seed" x="0" y="15" width="169" height="169" filterUnits="userSpaceOnUse">
      <feOffset input="SourceAlpha"/>
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feFlood flood-color="#f5d095"/>
      <feComposite operator="in" in2="blur"/>
      <feComposite in="SourceGraphic"/>
    </filter>

    <filter id="circle-sprout" x="200" y="15" width="169" height="169" filterUnits="userSpaceOnUse">
      <feOffset input="SourceAlpha"/>
      <feGaussianBlur stdDeviation="10" result="blur-2"/>
      <feFlood flood-color="#f5d095"/>
      <feComposite operator="in" in2="blur-2"/>
      <feComposite in="SourceGraphic"/>
    </filter>

    <filter id="circle-sapling" x="400" y="15" width="169" height="169" filterUnits="userSpaceOnUse">
      <feOffset input="SourceAlpha"/>
      <feGaussianBlur stdDeviation="10" result="blur-3"/>
      <feFlood flood-color="#f5d095"/>
      <feComposite operator="in" in2="blur-3"/>
      <feComposite in="SourceGraphic"/>
    </filter>

    <filter id="circle-tree" x="600" y="15" width="169" height="169" filterUnits="userSpaceOnUse">
      <feOffset input="SourceAlpha"/>
      <feGaussianBlur stdDeviation="10" result="blur-4"/>
      <feFlood flood-color="#f5d095"/>
      <feComposite operator="in" in2="blur-4"/>
      <feComposite in="SourceGraphic"/>
    </filter>

    <filter id="circle-forest" x="800" y="0" width="199" height="199" filterUnits="userSpaceOnUse">
      <feOffset input="SourceAlpha"/>
      <feGaussianBlur stdDeviation="15" result="blur-5"/>
      <feFlood flood-color="#f5d095"/>
      <feComposite operator="in" in2="blur-5"/>
      <feComposite in="SourceGraphic"/>
    </filter>
  </defs>

  <g id="roadmap-vis" transform="translate(30 45.249)">
    <!-- Main connecting line -->
    <line id="Line_1" data-name="Line 1" class="roadmap-horizontal-cls-1" x2="1150" transform="translate(7.5 54.425)"/>

    <!-- Seed Stage -->
    <g id="Group_39" data-name="Group 39">
      <g class="roadmap-horizontal-cls-7" transform="matrix(1, 0, 0, 1, -30, -45.25)">
        <path id="circle-seed" data-name="circle-seed" class="roadmap-horizontal-cls-2" d="M54.5,0A54.5,54.5,0,1,1,0,54.5,54.5,54.5,0,0,1,54.5,0Z" transform="translate(30 45)"/>
      </g>
      <text id="Seed" data-name="Seed" class="roadmap-horizontal-cls-3" transform="translate(54 61.751)" text-anchor="middle"><tspan x="0" y="0">Seed</tspan></text>
      <text id="Seed-desc" class="roadmap-horizontal-cls-4" transform="translate(54 137.751)" text-anchor="middle"><tspan x="0" y="0">Foundation</tspan><tspan x="0" y="18">Building</tspan></text>
    </g>

    <!-- Sprout Stage -->
    <g id="Group_40" data-name="Group 40" transform="translate(200)">
      <g class="roadmap-horizontal-cls-8" transform="matrix(1, 0, 0, 1, -230, -45.25)">
        <path id="circle-sprout" data-name="circle-sprout" class="roadmap-horizontal-cls-2" d="M54.5,0A54.5,54.5,0,1,1,0,54.5,54.5,54.5,0,0,1,54.5,0Z" transform="translate(230 45)"/>
      </g>
      <text id="Sprout" data-name="Sprout" class="roadmap-horizontal-cls-3" transform="translate(54 61.751)" text-anchor="middle"><tspan x="0" y="0">Sprout</tspan></text>
      <text id="Sprout-desc" class="roadmap-horizontal-cls-4" transform="translate(54 137.751)" text-anchor="middle"><tspan x="0" y="0">Active</tspan><tspan x="0" y="18">Development</tspan></text>
    </g>

    <!-- Sapling Stage -->
    <g id="Group_41" data-name="Group 41" transform="translate(400)">
      <g class="roadmap-horizontal-cls-9" transform="matrix(1, 0, 0, 1, -430, -45.25)">
        <path id="circle-sapling" data-name="circle-sapling" class="roadmap-horizontal-cls-2" d="M54.5,0A54.5,54.5,0,1,1,0,54.5,54.5,54.5,0,0,1,54.5,0Z" transform="translate(430 45)"/>
      </g>
      <text id="Sapling" data-name="Sapling" class="roadmap-horizontal-cls-3" transform="translate(54 61.751)" text-anchor="middle"><tspan x="0" y="0">Sapling</tspan></text>
      <text id="Sapling-desc" class="roadmap-horizontal-cls-4" transform="translate(54 137.751)" text-anchor="middle"><tspan x="0" y="0">First Major</tspan><tspan x="0" y="18">Milestone</tspan></text>
    </g>

    <!-- Tree Stage -->
    <g id="Group_42" data-name="Group 42" transform="translate(600)">
      <g class="roadmap-horizontal-cls-10" transform="matrix(1, 0, 0, 1, -630, -45.25)">
        <path id="circle-tree" data-name="circle-tree" class="roadmap-horizontal-cls-2" d="M54.5,0A54.5,54.5,0,1,1,0,54.5,54.5,54.5,0,0,1,54.5,0Z" transform="translate(630 45)"/>
      </g>
      <text id="Tree" data-name="Tree" class="roadmap-horizontal-cls-3" transform="translate(54 61.751)" text-anchor="middle"><tspan x="0" y="0">Tree</tspan></text>
      <text id="Tree-desc" class="roadmap-horizontal-cls-4" transform="translate(54 137.751)" text-anchor="middle"><tspan x="0" y="0">System</tspan><tspan x="0" y="18">Growth</tspan></text>
    </g>

    <!-- Forest Stage -->
    <g id="Group_43" data-name="Group 43" transform="translate(800)">
      <g class="roadmap-horizontal-cls-11" transform="matrix(1, 0, 0, 1, -830, -45.25)">
        <path id="circle-forest" data-name="circle-forest" class="roadmap-horizontal-cls-2" d="M54.5,0A54.5,54.5,0,1,1,0,54.5,54.5,54.5,0,0,1,54.5,0Z" transform="translate(830 45)"/>
      </g>
      <text id="Forest" data-name="Forest" class="roadmap-horizontal-cls-3" transform="translate(54 61.751)" text-anchor="middle"><tspan x="0" y="0">Forest</tspan></text>
      <text id="Forest-desc" class="roadmap-horizontal-cls-4" transform="translate(54 137.751)" text-anchor="middle"><tspan x="0" y="0">Growing in</tspan><tspan x="0" y="18">the Forest</tspan></text>
    </g>
  </g>
</svg>
